<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techniques of medical device</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#0f172a;line-height:1.6;padding-bottom:60px}
#err{display:none;background:#fee2e2;color:#991b1b;padding:12px 16px;font-size:14px;direction:ltr}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
.hero{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-radius:0 0 22px 22px;padding:28px 18px 22px;text-align:center}
.hero h1{font-size:26px;margin-bottom:4px}
.hero p{opacity:.9;font-size:14px}
.hero .by{margin-top:6px;font-weight:700;letter-spacing:.04em}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 6px}
.fbtn{padding:8px 14px;border-radius:20px;border:2px solid #0e7490;background:#fff;color:#0e7490;font-weight:700;font-size:13px;cursor:pointer}
.fbtn.active{background:#0e7490;color:#fff}
.count{text-align:center;color:#475569;font-size:14px;margin-bottom:6px}
.bar{position:sticky;top:0;z-index:50;background:#0f172a;color:#fff;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.bar .pill{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:14px}
.pg{flex:1;min-width:60px;height:6px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:#22d3ee;transition:width .3s}
.sec{margin:26px 0 6px;text-align:center;font-weight:700;color:#0e7490;font-size:14px;background:#e0f2fe;border:1px solid #bae6fd;border-radius:12px;padding:8px 12px}
.card{background:#fff;border-radius:16px;padding:18px 16px;margin:12px 0;box-shadow:0 2px 12px rgba(15,23,42,.08);border-right:6px solid #cbd5e1}
.card.ok{border-right-color:#10b981}.card.no{border-right-color:#ef4444}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:10px;direction:ltr}
.qn{background:#0e7490;color:#fff;min-width:32px;height:32px;border-radius:16px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.tag{background:#e0f2fe;color:#0e7490;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
.qt{font-size:16px;font-weight:700;direction:ltr;text-align:left;margin-bottom:12px}
.fig{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:6px;margin-bottom:12px;direction:ltr}

.hint{font-size:13px;color:#0e7490;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px;direction:ltr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:15px;cursor:pointer;color:#1e293b}
.opt b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:13px;background:#f1f5f9;border:2px solid #cbd5e1;font-size:12px;flex-shrink:0}
.opt.sel{border-color:#0e7490;background:#ecfeff}
.opt.right{border-color:#10b981;background:#ecfdf5;color:#065f46;font-weight:700}
.opt.right b{background:#10b981;border-color:#10b981;color:#fff}
.opt.bad{border-color:#ef4444;background:#fef2f2;color:#7f1d1d}
.opt.bad b{background:#ef4444;border-color:#ef4444;color:#fff}
.inp{width:100%;padding:11px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;margin-bottom:8px;direction:ltr}
.inp.ok{border-color:#10b981;background:#ecfdf5}.inp.no{border-color:#ef4444;background:#fef2f2}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{padding:10px 18px;border:0;border-radius:12px;background:#0e7490;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btn.gh{background:#e2e8f0;color:#334155}.btn.g{background:#059669}.btn.r{background:#dc2626}
.btn:disabled{opacity:.5;cursor:default}
.solbox{display:none;margin-top:12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px;direction:ltr;font-size:14px}
.solbox .ans{font-weight:700;color:#0e7490;border-bottom:1px dashed #bae6fd;padding-bottom:6px;margin-bottom:6px}
.grade{display:none;margin-top:10px}
.fb{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.fb.ok{background:#ecfdf5;color:#065f46;border-right:4px solid #10b981}
.fb.no{background:#fef2f2;color:#7f1d1d;border-right:4px solid #ef4444}
.note{margin-top:6px;padding:6px 10px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:8px}
.sub{display:block}
#result{display:none;background:#fff;border-radius:18px;padding:22px 16px;margin:20px 0;text-align:center;box-shadow:0 4px 20px rgba(15,23,42,.12)}
#result h2{margin-bottom:6px}
.big{font-size:44px;font-weight:900;color:#0e7490}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}
.stat{flex:1;border-radius:12px;padding:10px;font-weight:700}
.stat.c{background:#ecfdf5;color:#059669}.stat.w{background:#fef2f2;color:#dc2626}.stat.p{background:#fffbeb;color:#d97706}
.rev{text-align:right;margin-top:14px}
.ri{background:#fef2f2;border-right:4px solid #ef4444;border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.ri .q{font-weight:700;direction:ltr;text-align:left}
.sbtn{display:block;margin:20px auto 0;padding:14px 50px;font-size:16px}
</style>
</head>
<body>
<div id="err"></div>
<div class="hero">
  <h1>🩺 Techniques of medical device</h1>
  <p>Med term exam trial · Question Bank</p>
  <p class="by">BY MOSTAFA SALLAM</p>
</div>
<div class="wrap">
  <div class="filters" id="filters">
    <button class="fbtn active" data-cat="all">📚 الكل</button>
    <button class="fbtn" data-cat="s1">✅ Multiple Choice (Q1–26)</button>
    <button class="fbtn" data-cat="s2">✔️ True / False (Q1–8)</button>
  </div>
  <div class="count">عدد الأسئلة: <b id="qCount">34</b></div>
</div>
<div class="bar"><div class="bar-in">
  <span class="pill" id="sNum">0/0</span><span class="pill" id="sC">✅ 0</span><span class="pill" id="sW">❌ 0</span><span class="pill" id="sP">📊 0%</span>
  <div class="pg"><i id="sFill"></i></div>
</div></div>
<div class="wrap">
  <div id="cards"></div>
  <button class="btn sbtn" id="submitBtn" disabled>عرض النتيجة 🎯</button>
  <div id="result">
    <h2>🎉 انتهى الاختبار!</h2>
    <div class="big"><span id="rScore">0</span> / <span id="rTotal">0</span></div>
    <div id="rMsg"></div>
    <div class="stats"><div class="stat c">✅ صح<br><span id="rC">0</span></div><div class="stat w">❌ غلط<br><span id="rW">0</span></div><div class="stat p">📊 النسبة<br><span id="rP">0%</span></div></div>
    <div class="btns" style="justify-content:center"><button class="btn" id="againBtn">🔄 إعادة الاختبار</button><button class="btn gh" id="topBtn">🏠 للأعلى</button></div>
    <div class="rev" id="rev"></div>
  </div>
</div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='JS error: '+m+' (line '+l+')';}};
const L=['A','B','C','D','E','F'];
const SECS={
  s1:{tag:'✅ Multiple Choice',title:'Med term exam trial — Multiple Choice'},
  s2:{tag:'✔️ True / False',title:'True / False'}
};
let N=0;
const M=(sec,num,q,o,c,e,note)=>({n:++N,sec,num,type:(c.length>1?'multi':'mcq'),q:q,opts:o,c:c,exp:e,note:note||''});
const TF=["True","False"];
const ALL=[
/* ---------- Multiple Choice ---------- */
M('s1',1,"…………… is the process of recording the electrical activity of the heart over a period of time using electrodes placed on the skin.",["Electroencephalograph","Electromyograph","Electroretinograph","Electrocardiograph"],[3],"تسجيل النشاط الكهربي للقلب عبر أقطاب على الجلد = Electrocardiograph (ECG)."),
M('s1',2,"ECG, EEG, X-ray machines, CT, MRI machines are types of…………… Equipment",["Therapeutic","Diagnostics","none","Life support"],[1],"أجهزة التخطيط والأشعة (ECG, EEG, X-ray, CT, MRI) أجهزة تشخيصية (Diagnostics)."),
M('s1',3,".......…..……… measures the amount of light Passes through the tissue as in a finger probe.",["Reflectance","Transmittance"],[1],"الـ Transmittance يقيس كمية الضوء النافذة عبر النسيج زي مجس الإصبع."),
M('s1',4,"The normal heart rate of a human being is ............ beats per minute.",["72","200","1000","1"],[0],"معدل ضربات القلب الطبيعي حوالي 72 نبضة في الدقيقة."),
M('s1',5,"All of the following medical gases used in anesthesia Machine except .......................",["oxygen","nitrous oxide","medical air","carbon dioxide"],[3],"غازات ماكينة التخدير: الأكسجين وأكسيد النيتروز والهواء الطبي، أما ثاني أكسيد الكربون فلا."),
M('s1',6,"The electrical signal passes between the atria and ventricles through a group of cells called the …………………….",["(SA) node","(AV) node","heart fiber","atria"],[1],"الإشارة الكهربية بين الأذينين والبطينين تمر عبر العقدة الأذينية البطينية (AV node)."),
M('s1',7,"All of them are function of Anesthesia Machine except:",["Provides O2","mixes anesthetic gases and vapors","Organize heart pump","Enables patient ventilation"],[2],"ماكينة التخدير توفر الأكسجين وتخلط الغازات والأبخرة وتتيح التهوية، لكنها لا تنظّم ضخ القلب."),
M('s1',8,"-……….allows anesthetist to provide measured amount of oxygen to the patient",["Manometer","Pulse oximeter","Anesthesia","Flowmeter"],[3],"الـ Flowmeter يسمح للطبيب بإعطاء كمية محسوبة من الأكسجين للمريض."),
M('s1',9,"This supplies O2 in an emergency directly from the high pressure circuit and it is pure O2.",["Flowmeter","vaporizer","O2 flush","all of them"],[2],"زرار O2 flush يمد الأكسجين النقي مباشرة من دائرة الضغط العالي في الطوارئ."),
M('s1',10,"……………………. is a conductive pad in contact with the body that makes an electrical circuit with the ECG.",["rubber","Earth","Electrode","Strap"],[2],"القطب (Electrode) لوح موصل يلامس الجسم ويكوّن دائرة كهربية مع جهاز ECG."),
M('s1',11,"The leads used in an ECG machine can be divided into all of the following except",["Limb leads","augmented limb leads","chest Leads","head lead"],[3],"أنواع الـ leads: limb وaugmented limb وchest، ومفيش head lead."),
M('s1',12,"vaborizer is the device which produces a vapor from a volatile liquid anesthetic. Halogenated anesthetics include…………..",["Silver &silver choloride","isoflurane and sevoflurane","sulfate &phosphate","none"],[1],"المخدرات الهالوجينية تشمل isoflurane و sevoflurane."),
M('s1',13,"In anesthesia Machine excess gas is discharged through the .................",["soda lime","Vaporizer","APL valve","O2 flowmeter"],[2],"الغاز الزائد بيخرج من خلال صمام APL (Adjustable Pressure-Limiting)."),
M('s1',14,"....................... deliver fresh gas from a compressed gas source during each inspiration, and discharge all exhaled gas into the room",["Anesthesia","Ventilators","Vaporizer","Oximetry"],[1],"أجهزة التنفس الصناعي (Ventilators) تعطي غاز جديد مع كل شهيق وتطرد الزفير للغرفة."),
M('s1',15,"All are types of laboratory equipment except",["sample separation","Microscopy","Hematology","X-ray"],[3],"الـ X-ray جهاز تصوير تشخيصي وليس من أجهزة المعمل."),
M('s1',16,"-.................. absorption Carbon dioxide from the patient breathing circuit in anesthesia Machine",["soda lime","Vaporizer","APL","O2 flowmeter"],[0],"الـ Soda lime يمتص ثاني أكسيد الكربون من دائرة تنفس المريض."),
M('s1',17,"Infrared light is in the ................. wavelength",["660 nm","900-940nm","200 nm","1200 nm"],[1],"الضوء تحت الأحمر في جهاز الأكسجين طوله الموجي 900–940 nm (والأحمر 660 nm)."),
M('s1',18,".................. is/are the used mode of ventilation during general anesthesia.",["VCV&PCV","SIMV","CPAP","IPAP"],[0],"أوضاع التهوية المستخدمة أثناء التخدير العام: VCV (حجمي) وPCV (ضغطي)."),
M('s1',19,"ECG can be detected using .......... electrode",["3","5","10","all"],[3],"الـ ECG ممكن يتسجل بـ 3 أو 5 أو 10 أقطاب — يعني كلهم (all)."),
M('s1',20,"In ECG ............... electrode functions solely as a ground to prevent alternating- current interference",["RA","LA","RL","LL"],[2],"القطب RL (الرجل اليمنى) يعمل كأرضي (ground) لمنع تداخل التيار المتردد."),
M('s1',21,"The most common electrode used for an ECG machine is the …………….electrode because it is stable when exposed to biological tissue.",["Fi FiCl","Na NaCl","Si SiCl","Ag AgCl"],[3],"أشهر قطب في ECG هو فضة/كلوريد الفضة (Ag/AgCl) لثباته مع الأنسجة."),
M('s1',22,"Endoscopes, machines are types of",["Therapeutic Equipment only","Diagnostics Equipment only","Diagnostics & Therapeutic Equipment","Life support Equipment"],[2],"المناظير أجهزة تشخيصية وعلاجية معاً."),
M('s1',23,"Electrocardiographs record small voltages of about…………………… that appear on the skin as a result of cardiac activity.",["1 mV","1 V","1 kV","10 V"],[0],"الـ ECG يسجل جهود صغيرة حوالي 1 ملّي فولت."),
M('s1',24,"Cylinder sizes are designated according to letters, which one is common:",["size M","size V","size B","size E"],[3],"أشهر حجم أسطوانة غاز هو size E."),
M('s1',25,"…………………………… Is a noninvasive method for monitoring a person's oxygen saturation .",["ESU","EEG","ECG","SPO2"],[3],"قياس تشبّع الأكسجين بدون جراحة = SpO2 (Pulse oximetry)."),
M('s1',26,"Oximetry Probe Placement at all of the following except",["Finger","Earlobe","Heel (neonates)","Head"],[3],"المجس يوضع في الإصبع أو شحمة الأذن أو كعب الرضيع، وليس في الرأس."),
/* ---------- True / False ---------- */
M('s2',1,"Having cold hands or poor circulation are one of a Limitations for pulse oximetry.",TF,[0],"صح: برودة اليدين وضعف الدورة الدموية من حدود استخدام جهاز قياس الأكسجين."),
M('s2',2,"The vaporizer is graduated in percent concentrations.",TF,[0],"صح: الـ vaporizer مدرّج بنسب مئوية للتركيز."),
M('s2',3,"Pulse oximetry tells us SPO2, pulse rate and carbon dioxide concentration.",TF,[1],"خطأ: الجهاز يعطي SpO2 ومعدل النبض فقط، ولا يقيس تركيز ثاني أكسيد الكربون."),
M('s2',4,"EEG Diagnose and assist in treating heart disease and arrhythmias.",TF,[1],"خطأ: الـ EEG لتخطيط المخ، أما أمراض القلب واضطراب النبض فيشخّصها الـ ECG."),
M('s2',5,"Direct Coupling Occurs when the active electrode touches another metal instrument.",TF,[0],"صح: الـ Direct Coupling يحدث لما القطب النشط يلمس أداة معدنية أخرى."),
M('s2',6,"The ESU converts electrical energy drawn from the mains supply to a high frequency current.",TF,[0],"صح: جهاز الجراحة الكهربية ESU يحوّل كهرباء الشبكة إلى تيار عالي التردد."),
M('s2',7,"Electrocautery passing electrical current through tissue.",TF,[1],"خطأ حسب الملف: في الـ electrocautery التيار بيسخّن طرف القطب نفسه ولا يمر في النسيج (عكس الـ electrosurgery).")
,M('s2',8,"Transmittance Sensor used in Pulse oximetry measure the amount of light reflected back to the probe.",TF,[1],"خطأ: الـ Transmittance يقيس الضوء النافذ عبر النسيج، أما المنعكس فيقيسه الـ Reflectance sensor.")
];

/* ===== الحالة ===== */
var filter='all',cur=[],res={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s).toLowerCase().replace(/[.\s]+/g,' ').trim()}
function byN(n){for(var i=0;i<ALL.length;i++)if(ALL[i].n==n)return ALL[i];return null}
function correctText(q){
  if(q.type==='mcq'||q.type==='multi')return q.c.slice().sort(function(a,b){return a-b}).map(function(i){return L[i]+') '+q.opts[i]}).join('  +  ');
  if(q.type==='fill')return q.ans.join(' / ');
  return q.ans;
}
function render(){
  var h='',last='';
  cur.forEach(function(q){
    if(q.sec!==last){last=q.sec;h+='<div class="sec">'+esc(SECS[q.sec].title)+'</div>';}
    h+='<div class="card" id="c'+q.n+'"><div class="qh"><span class="qn">'+q.num+'</span><span class="tag">'+SECS[q.sec].tag+'</span></div>';
    h+='<div class="qt">'+esc(q.q)+'</div>';
    if(q.type==='mcq'||q.type==='multi'){
      if(q.type==='multi')h+='<div class="hint">اختر الإجابتين الصحيحتين (الفراغين) ثم اضغط «تأكيد الإجابة»</div>';
      h+='<div class="opts">'+q.opts.map(function(o,i){return '<button type="button" class="opt" data-act="opt" data-n="'+q.n+'" data-i="'+i+'"><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
      if(q.type==='multi')h+='<div class="btns"><button type="button" class="btn" data-act="confirm" data-n="'+q.n+'">تأكيد الإجابة ✔</button></div>';
    }else if(q.type==='fill'){
      h+=q.ans.map(function(a,i){return '<input class="inp" type="text" autocomplete="off" placeholder="'+(q.ans.length>1?'الإجابة '+(i+1):'اكتب إجابتك هنا')+'">'}).join('');
      h+='<div class="btns"><button type="button" class="btn" data-act="check" data-n="'+q.n+'">تحقق ✔</button><button type="button" class="btn gh" data-act="giveup" data-n="'+q.n+'">اعرض الإجابة 👁</button></div>';
    }else{
      h+='<input class="inp" type="text" autocomplete="off" placeholder="اكتب إجابتك هنا (اختياري)">';
      h+='<div class="btns"><button type="button" class="btn" data-act="show" data-n="'+q.n+'">اعرض الحل 👁</button></div>';
      h+='<div class="solbox" id="sol'+q.n+'"><div class="ans">Ans = '+esc(q.ans)+'</div>'+q.sol+'</div>';
      h+='<div class="grade" id="gr'+q.n+'"><div style="font-size:13px;margin-bottom:6px">قارن إجابتك بالحل وقيّم نفسك:</div><div class="btns"><button type="button" class="btn g" data-act="grade" data-v="1" data-n="'+q.n+'">✅ إجابتي صح</button><button type="button" class="btn r" data-act="grade" data-v="0" data-n="'+q.n+'">❌ إجابتي غلط</button></div></div>';
    }
    h+='<div class="fb" id="fb'+q.n+'"></div></div>';
  });
  $('cards').innerHTML=h;
}
function updateBar(){
  var total=cur.length,done=0,c=0;
  for(var k in res){done++;if(res[k])c++;}
  $('sNum').textContent=done+'/'+total;
  $('sC').textContent='✅ '+c;$('sW').textContent='❌ '+(done-c);
  $('sP').textContent='📊 '+(done?Math.round(c/done*100):0)+'%';
  $('sFill').style.width=(total?done/total*100:0)+'%';
  $('submitBtn').disabled=done<total;
}
function finish(q,ok){
  res[q.n]=ok;
  $('c'+q.n).className='card '+(ok?'ok':'no');
  var fb=$('fb'+q.n);fb.className='fb '+(ok?'ok':'no');fb.style.display='block';
  fb.innerHTML=(ok?'✅ إجابة صحيحة! ':'❌ الإجابة الصحيحة: <b dir="ltr">'+esc(correctText(q))+'</b><br>')+esc(q.exp)+(q.note?'<div class="note">'+esc(q.note)+'</div>':'');
  updateBar();
}
function lockOpts(q,picked){
  var bs=$('c'+q.n).querySelectorAll('.opt');
  for(var j=0;j<bs.length;j++){
    var i=+bs[j].getAttribute('data-i');
    bs[j].classList.remove('sel');
    if(q.c.indexOf(i)>-1)bs[j].classList.add('right');else if(picked.indexOf(i)>-1)bs[j].classList.add('bad');
    bs[j].disabled=true;
  }
}
function onClick(e){
  var b=e.target;
  while(b&&b!==document&&!(b.getAttribute&&b.getAttribute('data-act')))b=b.parentNode;
  if(!b||b===document)return;
  var q=byN(b.getAttribute('data-n'));
  if(!q||res[q.n]!==undefined)return;
  var act=b.getAttribute('data-act'),card=$('c'+q.n),i,inputs;
  if(act==='opt'){
    i=+b.getAttribute('data-i');
    if(q.type==='mcq'){lockOpts(q,[i]);finish(q,q.c.indexOf(i)>-1);}
    else b.classList.toggle('sel');
  }else if(act==='confirm'){
    var picked=[],sel=card.querySelectorAll('.opt.sel');
    for(i=0;i<sel.length;i++)picked.push(+sel[i].getAttribute('data-i'));
    if(!picked.length)return;
    var ok=picked.length===q.c.length&&q.c.every(function(x){return picked.indexOf(x)>-1});
    lockOpts(q,picked);b.disabled=true;finish(q,ok);
  }else if(act==='check'||act==='giveup'){
    inputs=card.querySelectorAll('.inp');
    var all=true,empty=true;
    for(i=0;i<inputs.length;i++){
      var good=norm(inputs[i].value)===norm(q.ans[i]);
      if(!good)all=false;if(inputs[i].value.trim())empty=false;
    }
    if(act==='check'&&empty)return;
    for(i=0;i<inputs.length;i++){inputs[i].className='inp '+(norm(inputs[i].value)===norm(q.ans[i])?'ok':'no');inputs[i].disabled=true;}
    var bt=card.querySelectorAll('.btns .btn');for(i=0;i<bt.length;i++)bt[i].disabled=true;
    finish(q,act==='check'&&all);
  }else if(act==='show'){
    $('sol'+q.n).style.display='block';$('gr'+q.n).style.display='block';b.disabled=true;
  }else if(act==='grade'){
    var inp=card.querySelector('.inp');if(inp)inp.disabled=true;
    $('gr'+q.n).style.display='none';finish(q,b.getAttribute('data-v')==='1');
  }
}
function start(scroll){
  cur=ALL.filter(function(q){return filter==='all'||q.sec===filter});
  res={};
  $('qCount').textContent=cur.length;
  $('result').style.display='none';
  render();updateBar();
  if(scroll)window.scrollTo(0,0);
}
function showResults(){
  var total=cur.length,c=cur.filter(function(q){return res[q.n]}).length,p=total?Math.round(c/total*100):0;
  $('rScore').textContent=c;$('rTotal').textContent=total;$('rC').textContent=c;$('rW').textContent=total-c;$('rP').textContent=p+'%';
  $('rMsg').textContent=p>=90?'ممتاز! مستواك رائع 🌟':p>=75?'جيد جداً، كمّل كده 👏':p>=50?'مستوى كويس، راجع الأخطاء وهتتحسن 💪':'محتاج مراجعة أكتر، ذاكر وجرّب تاني 📚';
  var wr=cur.filter(function(q){return !res[q.n]}),h='';
  if(wr.length){h='<h3>📝 مراجعة الأسئلة الغلط ('+wr.length+')</h3>';wr.forEach(function(q){h+='<div class="ri"><div class="q">'+SECS[q.sec].tag+' — Q'+q.num+': '+esc(q.q)+'</div><div>✅ <b dir="ltr">'+esc(correctText(q))+'</b></div><div>'+esc(q.exp)+'</div>'+(q.note?'<div class="note">'+esc(q.note)+'</div>':'')+'</div>';});}
  else h='<h3>🎯 كل إجاباتك صح!</h3>';
  $('rev').innerHTML=h;$('result').style.display='block';
  $('result').scrollIntoView();
}
function init(){
  var fb=document.querySelectorAll('.fbtn');
  for(var i=0;i<fb.length;i++)fb[i].addEventListener('click',function(){
    for(var j=0;j<fb.length;j++)fb[j].classList.remove('active');
    this.classList.add('active');filter=this.getAttribute('data-cat');start(false);
  });
  document.addEventListener('click',onClick);
  $('submitBtn').addEventListener('click',showResults);
  $('againBtn').addEventListener('click',function(){start(true)});
  $('topBtn').addEventListener('click',function(){window.scrollTo(0,0)});
  start(false);
}
init();
</script>
</body>
